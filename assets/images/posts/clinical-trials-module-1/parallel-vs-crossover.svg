<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Helvetica Neue',Arial,sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <line x1="360" y1="30" x2="360" y2="280" stroke="#e5e5e5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- Parallel (left) -->
  <text x="180" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d6cdf">평행 설계 (Parallel)</text>
  <rect x="120" y="60" width="120" height="40" rx="8" fill="#eef3fc" stroke="#2d6cdf" stroke-width="1.5"/>
  <text x="180" y="85" text-anchor="middle" font-size="13.5" fill="#333">무작위 배정</text>
  <line x1="160" y1="100" x2="95" y2="150" stroke="#888" stroke-width="1.8" marker-end="url(#a2)"/>
  <line x1="200" y1="100" x2="265" y2="150" stroke="#888" stroke-width="1.8" marker-end="url(#a2)"/>
  <rect x="35" y="155" width="120" height="44" rx="8" fill="#e3ecfb" stroke="#2d6cdf" stroke-width="1.5"/>
  <text x="95" y="182" text-anchor="middle" font-size="13.5" fill="#333">치료군</text>
  <rect x="205" y="155" width="120" height="44" rx="8" fill="#f3f3f3" stroke="#999" stroke-width="1.5"/>
  <text x="265" y="182" text-anchor="middle" font-size="13.5" fill="#333">대조군</text>
  <text x="180" y="240" text-anchor="middle" font-size="13" fill="#666">두 무리로 나눠 동시에 비교한다</text>

  <!-- Crossover (right) -->
  <text x="540" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#e8743b">교차 설계 (Crossover)</text>
  <rect x="405" y="150" width="86" height="44" rx="8" fill="#fdeee6" stroke="#e8743b" stroke-width="1.5"/>
  <text x="448" y="177" text-anchor="middle" font-size="13.5" fill="#333">치료 A</text>
  <rect x="505" y="158" width="60" height="28" rx="6" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/>
  <text x="535" y="177" text-anchor="middle" font-size="11.5" fill="#888">washout</text>
  <rect x="579" y="150" width="86" height="44" rx="8" fill="#fdeee6" stroke="#e8743b" stroke-width="1.5"/>
  <text x="622" y="177" text-anchor="middle" font-size="13.5" fill="#333">치료 B</text>
  <line x1="491" y1="172" x2="503" y2="172" stroke="#888" stroke-width="1.8" marker-end="url(#a2)"/>
  <line x1="565" y1="172" x2="577" y2="172" stroke="#888" stroke-width="1.8" marker-end="url(#a2)"/>
  <text x="540" y="240" text-anchor="middle" font-size="13" fill="#666">한 사람이 A·B를 차례로 (자기 대조)</text>
</svg>
